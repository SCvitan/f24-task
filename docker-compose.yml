services:
  postgres:
    image: postgres:17
    container_name: f24-db-container
    restart: unless-stopped
    environment:
      POSTGRES_DB: f24-task
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - file-system-postgres-data:/var/lib/postgresql/data

volumes:
  file-system-postgres-data: